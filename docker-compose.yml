services:
  postgres:
    image: postgres:16
    container_name: pg-acidentes
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg-dados:/var/lib/postgresql/data

  metabase:
    image: metabase/metabase:v0.64.2.7
    container_name: metabase
    ports:
      - "3000:3000"
    volumes:
      - metabase-dados:/metabase.db
    depends_on:
      - postgres

volumes:
  pg-dados:
  metabase-dados: